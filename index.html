<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wipeout Project — Personal Muhasabah</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #222222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.45;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print {
            max-width: 800px;
            margin: 0 auto 30px auto;
            background: #f9f9f9;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #111;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button.btn-primary {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            background-color: #333;
        }

        .action-bar-print {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #eef6ff;
            border: 1px solid #b6d4fe;
            border-radius: 6px;
        }

        .btn-print-trigger {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-print-trigger:hover {
            background-color: #0b5ed7;
        }

        #task-inputs-container {
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .task-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .task-input-row span {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 120px;
        }

        /* Printable Container */
        .print-container {
            width: 100%;
            max-width: 190mm;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Guide Page Styles for Clean 2-Page Printing */
        .guide-page {
            page-break-after: always;
            break-after: page;
            padding-bottom: 10px;
        }

        .guide-page h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .guide-page h3 {
            font-size: 1.05rem;
            margin-top: 14px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 2px;
        }

        .guide-page h4 {
            font-size: 0.92rem;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .guide-page p, .guide-page li {
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-align: justify;
            line-height: 1.4;
        }

        .guide-page ol, .guide-page ul {
            margin-top: 4px;
            margin-bottom: 8px;
            padding-left: 20px;
        }

        .quote-callout {
            background-color: #f4f4f4;
            border-left: 4px solid #111;
            padding: 8px 12px;
            font-style: italic;
            font-size: 0.82rem;
            margin: 10px 0;
            line-height: 1.4;
        }

        /* Force new page for each year block */
        .year-container.page-start {
            page-break-before: always;
            break-before: page;
        }

        .year-section-header {
            margin-top: 15px;
            margin-bottom: 15px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .year-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        .umar-quote-box {
            background-color: #f4f4f4;
            border-left: 4px solid #111;
            padding: 10px 14px;
            font-style: italic;
            font-size: 0.85rem;
            color: #111;
            margin-bottom: 15px;
            line-height: 1.4;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Chunked Grid Cards */
        .grid-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            page-break-inside: avoid;
            break-inside: avoid;
            box-sizing: border-box;
            width: 100%;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dotted #666;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .card-meta {
            font-size: 0.78rem;
            color: #333;
        }

        /* 15-Column Grid */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 4px;
            width: 100%;
            box-sizing: border-box;
            container-type: inline-size;
        }

        .checkbox-item {
            aspect-ratio: 1 / 1;
            border: 1px solid #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(6.5px, 2.3cqw, 8.5px);
            font-weight: 600;
            color: #000;
            background-color: #fff;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
            line-height: 1;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page-footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            margin-top: 6px;
            font-style: italic;
            border-top: 1px dashed #ddd;
            padding-top: 4px;
        }

        /* Print Media Styles */
        @page {
            size: A4 portrait;
            margin: 12mm;
        }

        @media print {
            body {
                background-color: #ffffff;
                color: #000000;
                padding: 0;
                margin: 0;
            }
            .no-print, .action-bar-print {
                display: none !important;
            }
            .print-container {
                max-width: 100%;
                padding: 0;
            }
            .grid-card {
                border: 1px solid #000 !important;
                margin-bottom: 12px;
            }
            .umar-quote-box, .quote-callout {
                background-color: #f4f4f4 !important;
                border-left: 4px solid #000 !important;
            }
            .checkbox-item {
                border-color: #000 !important;
                color: #000 !important;
            }
            .guide-page {
                page-break-after: always !important;
                break-after: page !important;
            }
            .page-start {
                page-break-before: always !important;
                break-before: page !important;
            }
        }
    </style>
</head>
<body>

    <!-- Controls Form (Hidden on Print) -->
    <div class="no-print">
        <h1>The Wipeout Project — Personal Muhasabah</h1>
        <div class="subtitle">Concealed Personal Accounting (Sitr) & Good Deed Redemption</div>
        
        <div class="form-group">
            <label for="start-year">Start Year (1900 – 2300):</label>
            <input type="number" id="start-year" value="2020" min="1900" max="2300">
        </div>

        <div class="form-group">
            <label for="end-year">End Year (1900 – 2300):</label>
            <input type="number" id="end-year" value="2026" min="1900" max="2300">
        </div>

        <div class="form-group">
            <label for="num-tasks">Number of Items / Sins to Purify (1 – 20):</label>
            <!-- FIXED: Changed onchange to oninput so spinner arrows instantly generate input rows -->
            <input type="number" id="num-tasks" value="3" min="1" max="20" oninput="generateTaskInputs()">
        </div>

        <div id="task-inputs-container"></div>

        <button class="btn-primary" onclick="generateTracker()">Generate Preview & Printable Sheets</button>
    </div>

    <!-- Manual Print Trigger Button -->
    <div id="action-bar" class="action-bar-print" style="display: none;">
        <button class="btn-print-trigger" onclick="window.print()">🖨️ Print This Document</button>
        <div style="font-size: 0.85rem; color: #555; margin-top: 5px;">Make sure your printer background graphics option is enabled for best results.</div>
    </div>

    <!-- Printable Area -->
    <div id="print-area" class="print-container"></div>

    <script>
        function generateTaskInputs() {
            let count = parseInt(document.getElementById('num-tasks').value) || 1;
            if (count < 1) count = 1;
            if (count > 20) count = 20;

            const container = document.getElementById('task-inputs-container');
            container.innerHTML = '<strong>Assign Target Amount per Purification Item (Max: 20,000):</strong><br><br>';

            for (let i = 1; i <= count; i++) {
                const labelName = `Purification ${String(i).padStart(2, '0')}`;
                const row = document.createElement('div');
                row.className = 'task-input-row';
                row.innerHTML = `
                    <span>${labelName}</span>
                    <input type="number" id="task-target-${i}" value="1000" min="1" max="20000" placeholder="Target Amount (Max 20,000)" style="flex: 1;">
                `;
                container.appendChild(row);
            }
        }

        window.onload = function() {
            generateTaskInputs();
        };

        function generateTracker() {
            const startYear = parseInt(document.getElementById('start-year').value);
            const endYear = parseInt(document.getElementById('end-year').value);
            const numTasks = parseInt(document.getElementById('num-tasks').value);
            const printArea = document.getElementById('print-area');
            const actionBar = document.getElementById('action-bar');

            // 1. Year Validation
            if (isNaN(startYear) || startYear < 1900 || startYear > 2300) {
                alert("Please enter a valid Start Year between 1900 and 2300.");
                return;
            }
            if (isNaN(endYear) || endYear < 1900 || endYear > 2300) {
                alert("Please enter a valid End Year between 1900 and 2300.");
                return;
            }
            if (startYear > endYear) {
                alert("Start Year cannot be later than End Year.");
                return;
            }

            // 2. Target Amount Validation
            let taskProgress = {};
            for (let i = 1; i <= numTasks; i++) {
                const targetInput = document.getElementById(`task-target-${i}`);
                let totalTarget = parseInt(targetInput ? targetInput.value : 1000);

                if (isNaN(totalTarget) || totalTarget < 1) {
                    alert(`Purification ${String(i).padStart(2, '0')} must have a target of at least 1.`);
                    return;
                }
                if (totalTarget > 20000) {
                    alert(`Purification ${String(i).padStart(2, '0')} target cannot exceed 20,000.`);
                    return;
                }

                taskProgress[i] = {
                    totalTarget: totalTarget,
                    remainingTarget: totalTarget,
                    currentCounter: 1
                };
            }

            const totalYears = (endYear - startYear) + 1;
            printArea.innerHTML = '';

            // --- PAGE 1: GUIDE TO SINCERE REPENTANCE (PART 1) ---
            const page1Div = document.createElement('div');
            page1Div.className = 'guide-page';
            page1Div.innerHTML = `
                <h2>🌿 A Spiritual & Psychological Guide to Sincere Repentance (Tawbah)</h2>
                <div class="quote-callout">
                    &ldquo;Indeed, good deeds wipe out bad ones. That is a reminder for those who remember.&rdquo; &mdash; <strong>Surah Hud (11:114)</strong>
                </div>

                <h3>1. What Makes Repentance "Sincere"?</h3>
                <p>Repentance is not a mere verbal recitation; it is a complete reset of the heart and direction. Classical scholars outline four essential conditions for repentance to be sincere:</p>
                <ol>
                    <li><strong>Immediate Cessation (Al-Iqla'):</strong> Stop the sin immediately and dismantle the environment around it.</li>
                    <li><strong>Sincere Remorse (An-Nadam):</strong> Feel genuine grief in your heart for having transgressed against Allah. The Prophet ﷺ said: <em>&ldquo;Remorse is repentance.&rdquo;</em> (Sunan Ibn Majah)</li>
                    <li><strong>Firm Resolve (Al-'Azm):</strong> Make a solemn, unshakeable intention never to return to the sin.</li>
                    <li><strong>Strict Boundary Setting & Trigger Removal:</strong> You must actively block the pathways and temptations that led to the sin. Because you now understand your triggers, you must close those doors permanently.</li>
                </ol>
                <p><em>(Note: If the sin violated the rights of another human being, you must also restore their rights or seek their forgiveness).</em></p>

                <h3>2. A Practical Approach: Quality Over Impractical Quantity</h3>
                <p>A common mistake when confronting past shortfalls is falling into overload&mdash;such as attempting to pray thousands of individual <em>Nafl</em> prayers for every single past mistake. This is impractical.</p>
                <p>Islam values sincere devotion over overwhelming quantity:</p>
                <ul>
                    <li><strong>Salat at-Tawbah for a Lifetime:</strong> You do not need thousands of separate prayers. Praying two Rak'ahs of <em>Salat at-Tawbah</em> with deep presence, humility, and submission can suffice for your entire past, provided you have fulfilled the conditions of sincere repentance.</li>
                    <li><strong>Devotional Istighfar:</strong> While praying endless individual prayers for every past mistake is impractical, reciting <em>Istighfar</em> with deep, conscious devotion for each specific shortfall is completely achievable and highly recommended.</li>
                    <li><strong>Sayyidul Istighfar & Continuous Good Deeds:</strong> Frequently recite <em>Sayyidul Istighfar</em> (the Master Supplication for Forgiveness) and follow past mistakes with positive good deeds.</li>
                </ul>
            `;
            printArea.appendChild(page1Div);

            // --- PAGE 2: GUIDE TO SINCERE REPENTANCE (PART 2) ---
            const page2Div = document.createElement('div');
            page2Div.className = 'guide-page';
            page2Div.innerHTML = `
                <h3>3. The Psychological Trap: The Whispers of Despair (Ya's)</h3>
                <p>When Satan fails to entice you into sin, he changes tactics: he tempts you with despair.</p>
                <p>He whispers: <em>&ldquo;You knew better, yet you still sinned. You are a hypocrite, too dirty to be saved, and Allah will never forgive you.&rdquo;</em></p>

                <h4>⚠️ A Critical Warning from Islamic Psychology</h4>
                <p>Scholars of spiritual purification (<em>Tazkiyah</em>), such as Imam Al-Ghazali in <em>Ihya 'Ulum al-Din</em>, warn against obsessing over past numbers:</p>
                <ul>
                    <li><strong>Despair is a Major Sin:</strong> Feeling guilty is healthy; believing your sins are larger than Allah’s capacity to forgive is a severe theological error.</li>
                    <li><strong>Allah's Mercy Dwarfs Any Calculation:</strong> Allah's attributes of mercy&mdash;<em>Al-Ghafur</em> (The All-Forgiving) and <em>Al-Rahman</em> (The Most Compassionate)&mdash;completely dwarf any finite number a human being can calculate.</li>
                    <li><strong>The Core Purpose of This Tool:</strong> This tool exists to give you a tangible simulation of how your shortfalls might appear when presented before you on <em>Maidan al-Hashr</em> (the Day of Gathering). It is built directly upon the profound advice of Umar ibn al-Khattab (RA): <em>&ldquo;Hold yourselves accountable before you are held accountable, and weigh your deeds before they are weighed for you.&rdquo;</em> It serves as a temporary scaffolding for structured self-reckoning&mdash;never as a weight to make you feel doomed, helpless, or despairing of Allah's infinite mercy.</li>
                </ul>

                <h3>4. What To Do After Sincere Repentance</h3>
                <p>Once you have repented sincerely, you have two choices regarding this physical tracker or PDF:</p>
                <ul>
                    <li><strong>Option A: Keep It as an Advisory Reminder</strong><br>Keep the record private if it serves as a gentle reminder of where you came from, helping you stay humble, recognize your triggers, and ensure you never slide back.</li>
                    <li><strong>Option B: Erase or Destroy It (Highly Recommended if Burdened)</strong><br>If looking at the numbers causes you mental anguish, shame, or makes you feel "doomed," destroy or erase this tracker immediately.</li>
                </ul>
                <div class="quote-callout">
                    🛑 <strong>Remember:</strong> Feeling hopeless or dirty after sincere repentance is 100% a whisper from Satan (<em>Waswas</em>) designed to paralyze your worship today. Once repented, put the numbers away and move forward in Allah's mercy.
                </div>

                <h3>5. What If You Stumble Again? (Never Fall for the Trap)</h3>
                <p>If, despite your absolute best efforts and removing all triggers, you slip and commit the sin again: Do not despair and do not wait.</p>
                <ol>
                    <li><strong>Immediately Pray 2 Rak'ahs of Nafl / Salat at-Tawbah:</strong> Stand before Allah immediately and seek forgiveness (<em>Istighfar</em>) with a sincere heart.</li>
                    <li><strong>Beware the "I Am Hypocritical & Unworthy" Trap:</strong> If you slip again&mdash;even after crying in sincere repentance and making a firm resolve never to return&mdash;Satan will whisper: <em>&ldquo;Look at you. You repented sincerely, promised Allah you were done, and yet you broke your promise and failed again. You are just a hypocrite, and standing before Allah in prayer now is just insincere.&rdquo;</em> This is one of his most subtle traps. We must humbly admit our weakness, but we must never turn away from Allah out of shame. Broken promises do not mean you should abandon prayer; they mean you need Allah's mercy even more. The Prophet Muhammad ﷺ commanded us: <em>&ldquo;Fear Allah wherever you are, follow a bad deed with a good deed and it will erase it, and behave towards people with good character.&rdquo;</em> (Jami` at-Tirmidhi) No matter how many times you stumble after repenting, turn back immediately, pray two Rak'ahs, and seek His forgiveness again.</li>
                </ol>
                <div class="quote-callout">
                    &ldquo;Say, 'O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.'&rdquo; &mdash; <strong>Surah Az-Zumar (39:53)</strong>
                </div>
            `;
            printArea.appendChild(page2Div);

            // --- RENDER YEARLY TRACKER SHEETS ---
            const MAX_BOXES_PER_CARD = 150; 
            let renderedYearsCount = 0;

            for (let y = 0; y < totalYears; y++) {
                const currentYear = startYear + y;
                const yearsLeft = totalYears - y;

                const yearSection = document.createElement('div');
                yearSection.className = 'year-container page-start';

                const yearHeaderHTML = `
                    <div class="year-section-header">
                        <div class="year-title">Year ${currentYear}</div>
                        <div class="umar-quote-box">
                            &ldquo;Hold yourselves accountable before you are held accountable, and weigh your deeds before they are weighed for you. For indeed, it will be easier for your accounting tomorrow if you hold yourselves accountable today.&rdquo; &mdash; Umar ibn al-Khattab (RA)
                        </div>
                    </div>
                `;
                yearSection.innerHTML = yearHeaderHTML;

                let yearHasTasks = false;

                for (let i = 1; i <= numTasks; i++) {
                    const taskName = `Purification ${String(i).padStart(2, '0')}`;
                    const p = taskProgress[i];

                    if (p.remainingTarget <= 0) continue;

                    const yearTarget = Math.ceil(p.remainingTarget / yearsLeft);
                    const actualCount = Math.min(yearTarget, p.remainingTarget);

                    if (actualCount <= 0) continue;
                    yearHasTasks = true;

                    let itemsRendered = 0;
                    let partCounter = 1;
                    const totalParts = Math.ceil(actualCount / MAX_BOXES_PER_CARD);

                    while (itemsRendered < actualCount) {
                        const chunkSize = Math.min(MAX_BOXES_PER_CARD, actualCount - itemsRendered);
                        const startIdx = p.currentCounter;
                        const endIdx = p.currentCounter + chunkSize - 1;

                        const card = document.createElement('div');
                        card.className = 'grid-card';

                        const partLabel = totalParts > 1 ? ` [Part ${partCounter}/${totalParts}]` : '';

                        const cardHeaderHTML = `
                            <div class="card-header">
                                <span class="card-title">${taskName}${partLabel}</span>
                                <span class="card-meta">Year ${currentYear} | Items #${startIdx} &ndash; #${endIdx} (Chunk: ${chunkSize} / Year Target: ${actualCount})</span>
                            </div>
                        `;

                        let gridHTML = '<div class="checkbox-grid">';
                        for (let c = 0; c < chunkSize; c++) {
                            gridHTML += `<div class="checkbox-item">${startIdx + c}</div>`;
                        }
                        gridHTML += '</div>';

                        const footerHTML = `
                            <div class="page-footer-note">
                                &ldquo;Indeed, good deeds wipe out bad ones.&rdquo; &mdash; Surah Hud 11:114
                            </div>
                        `;

                        card.innerHTML = cardHeaderHTML + gridHTML + footerHTML;
                        yearSection.appendChild(card);

                        p.currentCounter += chunkSize;
                        p.remainingTarget -= chunkSize;
                        itemsRendered += chunkSize;
                        partCounter++;
                    }
                }

                if (yearHasTasks) {
                    printArea.appendChild(yearSection);
                    renderedYearsCount++;
                }
            }

            actionBar.style.display = 'block';
            actionBar.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
